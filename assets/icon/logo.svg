<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e2d5a"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </radialGradient>
    <linearGradient id="loop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!--
    The mark: an open loop (the recurring monthly round) with a check (tracked,
    paid). One 315° arc, radius 32, gap centered at -45° so the opening reads
    as motion about to close; the check sits optically centered inside.
  -->
  <path d="M 79.56 37.75 A 32 32 0 1 1 62.25 20.44"
        fill="none" stroke="url(#loop)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 37.5 51 L 46 59.5 L 63 39.5"
        fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
