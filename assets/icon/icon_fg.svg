<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 182 182" width="1024" height="1024">
  <!--
    Adaptive icon foreground: loop + check, no background.
    The logo (100x100 design) is centered on the 182 canvas and scaled up to
    ~1.44 so the loop fills the adaptive safe/visible zone instead of floating
    small in the middle. The loop's outer edge sits at the 66dp safe-zone edge;
    the check (key content) stays well inside.
  -->
  <defs>
    <linearGradient id="loop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <g transform="translate(91 91) scale(1.44) translate(-50 -50)">
    <path d="M 79.56 37.75 A 32 32 0 1 1 62.25 20.44"
          fill="none" stroke="url(#loop)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 37.5 51 L 46 59.5 L 63 39.5"
          fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
