<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!--
    Notification icon: white silhouette on transparent background.
    Android requires single-color (white) icons for the status bar/notification
    shade — same loop + check mark as the launcher icon, all full white.
  -->
  <path d="M 79.56 37.75 A 32 32 0 1 1 62.25 20.44"
        fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <path d="M 37.5 51 L 46 59.5 L 63 39.5"
        fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
