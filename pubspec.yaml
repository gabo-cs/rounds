name: rounds
description: "Rounds — personal bill tracking app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.0

  # Backup: export / share / import
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  file_picker: ^11.0.2

  # Utilities
  intl: ^0.20.1
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0a0f1e"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21
  # iOS icons must be opaque (App Store rejects alpha); flatten onto the dark
  # background, which matches the icon's edges so the corners stay seamless.
  remove_alpha_ios: true
  background_color_ios: "#0a0f1e"

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: SplineSansMono
      fonts:
        - asset: assets/fonts/SplineSansMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SplineSansMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/SplineSansMono-SemiBold.ttf
          weight: 600
