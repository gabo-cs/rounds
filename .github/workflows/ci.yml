name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Drift tests open a real SQLite database; the runner image ships the
      # versioned libsqlite3.so.0 but the Dart sqlite3 package loads the
      # unversioned name, which only the -dev package provides.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # Pinned to the version used locally: a floating stable channel let a
      # new release's deprecations fail analyze on unchanged code. Move it
      # forward deliberately, together with the local toolchain.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
